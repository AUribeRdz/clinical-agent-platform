services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinical}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clinical}
      JWT_SECRET: ${JWT_SECRET:-demo-secret-change-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CONFIDENCE_THRESHOLD_ADVERSE_EVENT: ${CONFIDENCE_THRESHOLD_ADVERSE_EVENT:-0.92}
      CONFIDENCE_THRESHOLD_PROTOCOL_DEV: ${CONFIDENCE_THRESHOLD_PROTOCOL_DEV:-0.95}
      CONFIDENCE_THRESHOLD_SITE_NOTE: ${CONFIDENCE_THRESHOLD_SITE_NOTE:-0.70}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:4000
      REACT_APP_DEMO_TOKEN: demo-token
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clinical}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EDC_MOCK_URL: http://api:4000/mock-edc
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

volumes:
  pgdata:
    name: clinical_agent_pgdata

networks:
  internal:
    driver: bridge